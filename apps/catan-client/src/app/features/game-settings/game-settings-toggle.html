@if (visible()) {
  <div class="settings-dock">
    @if (settings.panelOpen()) {
      <app-game-settings-panel />
    } @else if (settings.performanceOverlayEnabled() && settings.latestStats(); as stats) {
      <div class="settings-overlay" aria-live="polite">
        <span>FPS {{ formatNumber(stats.fps, 1) }}</span>
        <span>{{ formatNumber(stats.frameMs, 2) }} ms</span>
        <span>{{ stats.drawCalls }} DC</span>
      </div>
    }
    <button
      type="button"
      class="settings-toggle"
      [class.settings-toggle--active]="settings.panelOpen()"
      [attr.aria-expanded]="settings.panelOpen()"
      [attr.title]="title()"
      [attr.aria-label]="ariaLabel()"
      (click)="settings.togglePanel()"
    >
      <svg
        class="settings-toggle__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.02 7.02 0 0 0-1.63-.94l-.36-2.54A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.36 2.54a7.02 7.02 0 0 0-1.63.94l-2.39-.96a.49.49 0 0 0-.59.22L2.62 8.98a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.14.24.44.33.69.22l2.39-.96c.5.39 1.05.7 1.63.94l.36 2.54c.05.28.27.47.55.47h4c.28 0 .5-.19.55-.47l.36-2.54c.58-.24 1.13-.55 1.63-.94l2.39.96c.25.1.55 0 .69-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
        />
      </svg>
    </button>
  </div>
}
