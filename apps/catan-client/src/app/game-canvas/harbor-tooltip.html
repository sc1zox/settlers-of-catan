@let m = model();
@if (m) {
  <div class="tooltip" [style.left.px]="m.x + 14" [style.top.px]="m.y + 14">
    <div class="ratio">{{ m.harbor.ratioFrom }} : {{ m.harbor.ratioTo }}</div>
    <div class="title">{{ 'harbor.title' | translate }}</div>
    <div class="detail">{{ detail() }}</div>
  </div>
}
