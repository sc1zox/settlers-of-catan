services:
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning

  turn:
    image: coturn/coturn:latest
    ports:
      - "${TURN_LISTEN_PORT:-3478}:${TURN_LISTEN_PORT:-3478}/udp"
      - "${TURN_LISTEN_PORT:-3478}:${TURN_LISTEN_PORT:-3478}/tcp"
      - "${TURN_RTC_UDP_RANGE_PUBLISH:-49160-49200}:${TURN_RTC_UDP_RANGE_PUBLISH:-49160-49200}/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=${TURN_LISTEN_PORT:-3478}"
      - "--min-port=${TURN_RTC_MIN_PORT:-49160}"
      - "--max-port=${TURN_RTC_MAX_PORT:-49200}"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--user=catan:${TURN_PASSWORD}"
      - "--realm=catan"
      - "--no-tls"
      - "--no-dtls"

  livekit:
    image: livekit/livekit-server:latest
    volumes:
      - ${LIVEKIT_CONFIG_HOST_PATH:-./deploy/livekit.prod.yaml}:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "${LIVEKIT_PUBLISH_HTTP:-7880}:7880"
      - "${LIVEKIT_PUBLISH_RTC_TCP:-7881}:7881"
      - "${LIVEKIT_PUBLISH_UDP_PRIMARY:-7882}:7882/udp"
      - "${LIVEKIT_PUBLISH_UDP_RANGE:-50000-50100}:50000-50100/udp"
    depends_on:
      - turn

  api:
    image: ${CATAN_WEB_IMAGE:-ghcr.io/sc1zox/settlers-of-catan:web}
    expose:
      - "${API_CONTAINER_PORT:-3000}"
    environment:
      PORT: ${API_CONTAINER_PORT:-3000}
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PLAYER_SESSION_JWT_SECRET: ${PLAYER_SESSION_JWT_SECRET}
      PLAYER_SESSION_ACCESS_TTL: ${PLAYER_SESSION_ACCESS_TTL:-15m}
      PLAYER_SESSION_REFRESH_TTL: ${PLAYER_SESSION_REFRESH_TTL:-30d}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_HTTP_URL: ${LIVEKIT_HTTP_URL:-http://livekit:7880}
    depends_on:
      - redis
      - livekit

  web:
    image: ${CATAN_WEB_IMAGE:-ghcr.io/sc1zox/settlers-of-catan:web}
    ports:
      - "${PUBLIC_WEB_PORT:-80}:${WEB_INTERNAL_PORT:-80}"
    environment:
      NGINX_LISTEN_PORT: "${WEB_INTERNAL_PORT:-80}"
      CATAN_API_UPSTREAM: "${CATAN_API_UPSTREAM:-http://api:${API_CONTAINER_PORT:-3000}}"
    depends_on:
      - api
