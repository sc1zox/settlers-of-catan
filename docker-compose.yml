services:
  redis:
    image: redis:7-alpine
    container_name: catan-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  livekit:
    image: livekit/livekit-server:latest
    container_name: catan-livekit
    command: --config /etc/livekit.yaml --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: catan-dev-base
    container_name: catan-api
    working_dir: /workspace
    command: npx nx serve catan-api --host=0.0.0.0 --outputStyle=stream
    environment:
      NODE_ENV: development
      PORT: "3000"
      NX_DAEMON: "false"
      CHOKIDAR_USEPOLLING: "1"
      REDIS_URL: redis://redis:6379
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret
      LIVEKIT_HTTP_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - livekit
    volumes:
      - ./:/workspace
      - /workspace/node_modules
      - /workspace/.nx
      - /workspace/.angular
      - /workspace/dist

  web:
    image: catan-dev-base
    container_name: catan-web
    working_dir: /workspace
    command: npx nx serve catan-client --host=0.0.0.0 --outputStyle=stream
    environment:
      NODE_ENV: development
      NX_DAEMON: "false"
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "4200:4200"
    depends_on:
      - api
    volumes:
      - ./:/workspace
      - /workspace/node_modules
      - /workspace/.nx
      - /workspace/.angular
      - /workspace/dist
